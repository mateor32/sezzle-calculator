# Runs the whole stack with a single command:
#
#   docker compose up --build
#
# The UI is then served on http://localhost:3000 and the API on
# http://localhost:8080.

services:
  backend:
    build:
      context: ./backend
    container_name: calculator-backend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      # The browser talks to the API directly, so the origin that has to be
      # allowed is the one the UI is served from on the host, not the container
      # name. This is deliberately narrower than the "*" default of the server.
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Vite inlines this at build time. It is the URL the *browser* uses, so
        # it points at the published host port rather than at the service name.
        VITE_API_BASE_URL: "http://localhost:8080/api"
    container_name: calculator-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
