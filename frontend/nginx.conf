server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The bundle is plain text and compresses very well.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite fingerprints every asset filename, so those files can be cached
    # indefinitely; a new build produces new names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, otherwise a browser keeps loading the
    # asset names of a previous deployment.
    location / {
        add_header Cache-Control "no-cache";
        # Single page application fallback: unknown paths render the app rather
        # than a 404.
        try_files $uri $uri/ /index.html;
    }

    # Basic hardening for a static bundle.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
